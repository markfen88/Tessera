name: Build native bundles

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      RUSTUP_TOOLCHAIN: 1.99.1
      TESSERA_DEB_REVISION: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-ubuntu-arm64-rust199-${{ hashFiles('**/Cargo.lock') }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libavahi-client-dev dpkg-dev groff-base
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build native Ubuntu 24.04 arm64 bundle
        run: packaging/build-bundle.sh --allow-ubuntu-24.04
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-ubuntu-noble-arm64
          path: target/bundle/*
          if-no-files-found: error
          retention-days: 7
