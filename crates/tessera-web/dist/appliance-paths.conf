# tessera-web: what the EQ engine pages of appliance mode need from the
# unit beyond its default hardening. Install as
# /etc/systemd/system/tessera-web.service.d/appliance-paths.conf (the
# directory may need creating), then:
#   sudo systemctl daemon-reload && sudo systemctl restart tessera-web
#
# Paths. The unit's ProtectSystem=strict makes the whole file system
# read-only for the portal; these lines open exactly what the EQ engine
# pages write: the configuration directory and the coefficient directory of
# [appliance.camilladsp] (uploads, the signal boost, deletions) and its
# state file (written only when the engine is not reachable and not
# running, before the portal restarts it). Adjust the paths to the
# configuration. The portal's user also needs write permission from the
# file system itself: add tessera-web to the group that owns the files and
# give the group write access (docs/web-portal.md, "EQ engine"). The
# leading `-` makes a missing path a no-op rather than a start failure.
#
# /var/lib/alsa is for `alsactl store` after a volume change; it is optional
# (without it the mixer state is still saved at a clean shutdown by
# alsa-restore.service) and needs group write on asound.state as well.
#
# Devices (only with an [appliance.volume] table; drop the four lines
# otherwise). The Volume card runs `amixer`, which opens the control
# device of the card under /dev/snd. PrivateDevices=yes stays: BindPaths
# puts the host's /dev/snd into the private /dev, DeviceAllow then opens
# exactly one node, the card's control device (nothing else under
# /dev/snd: no PCM, no sequencer), and SupplementaryGroups adds the group
# that owns it (`audio` on Debian). The control device follows the card
# index: `amixer -c <card> info` prints "Card ...:<index>", and
# `ls -l /dev/snd` lists controlC<index>. Verified on systemd 257: the
# allowed node opens, the others are refused with EPERM.

[Service]
ReadWritePaths=-/opt/camilladsp/configs
ReadWritePaths=-/opt/camilladsp/coeffs
ReadWritePaths=-/opt/camilladsp/statefile.yml
ReadWritePaths=-/var/lib/alsa
BindPaths=-/dev/snd
DeviceAllow=/dev/snd/controlC0 rw
SupplementaryGroups=audio
