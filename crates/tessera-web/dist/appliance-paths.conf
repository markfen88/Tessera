# tessera-web: what the EQ engine pages of appliance mode need from the
# unit beyond its default hardening. Install as
# /etc/systemd/system/tessera-web.service.d/appliance-paths.conf (the
# directory may need creating), then:
#   sudo systemctl daemon-reload && sudo systemctl restart tessera-web
#
# Paths. The unit's ProtectSystem=strict makes the whole file system
# read-only for the portal; these lines open exactly what the EQ engine
# pages write: the configuration directory and the coefficient directory of
# [appliance.camilladsp] (uploads, the signal boost, deletions) and its
# state file (written only when the engine is not reachable and not
# running, before the portal restarts it). Adjust the paths to the
# configuration. The portal's user also needs write permission from the
# file system itself: add tessera-web to the group that owns the files and
# give the group write access (docs/web-portal.md, "EQ engine"). The
# leading `-` makes a missing path a no-op rather than a start failure.
#
# The Volume card keeps its value in the portal's own state directory
# (/var/lib/tessera-web, the unit's StateDirectory), not with `alsactl`: it
# needs nothing here.
#
# Devices (only with an [appliance.volume] table; drop the lines
# otherwise). The Volume card runs `amixer`, which finds the card by its name
# by opening the control devices under /dev/snd one after the other.
# PrivateDevices=yes stays: BindPaths puts the host's /dev/snd into the
# private /dev, DeviceAllow then opens the control device of every card index
# (controlC0 to controlC31, the kernel's limit; DeviceAllow takes no wildcard
# in a path, and a node that does not exist is ignored), so the card may take
# another index after a reboot. Nothing else under /dev/snd is opened: no PCM,
# no sequencer, no timer, which `DeviceAllow=char-alsa rw` would open and let
# the portal play and record. SupplementaryGroups adds the group that owns
# the nodes (`audio` on Debian). Verified on systemd 257: a listed node
# opens, a node not listed is refused with EPERM, a missing listed node does
# not stop the unit.

[Service]
ReadWritePaths=-/opt/camilladsp/configs
ReadWritePaths=-/opt/camilladsp/coeffs
ReadWritePaths=-/opt/camilladsp/statefile.yml
BindPaths=-/dev/snd
DeviceAllow=/dev/snd/controlC0 rw
DeviceAllow=/dev/snd/controlC1 rw
DeviceAllow=/dev/snd/controlC2 rw
DeviceAllow=/dev/snd/controlC3 rw
DeviceAllow=/dev/snd/controlC4 rw
DeviceAllow=/dev/snd/controlC5 rw
DeviceAllow=/dev/snd/controlC6 rw
DeviceAllow=/dev/snd/controlC7 rw
DeviceAllow=/dev/snd/controlC8 rw
DeviceAllow=/dev/snd/controlC9 rw
DeviceAllow=/dev/snd/controlC10 rw
DeviceAllow=/dev/snd/controlC11 rw
DeviceAllow=/dev/snd/controlC12 rw
DeviceAllow=/dev/snd/controlC13 rw
DeviceAllow=/dev/snd/controlC14 rw
DeviceAllow=/dev/snd/controlC15 rw
DeviceAllow=/dev/snd/controlC16 rw
DeviceAllow=/dev/snd/controlC17 rw
DeviceAllow=/dev/snd/controlC18 rw
DeviceAllow=/dev/snd/controlC19 rw
DeviceAllow=/dev/snd/controlC20 rw
DeviceAllow=/dev/snd/controlC21 rw
DeviceAllow=/dev/snd/controlC22 rw
DeviceAllow=/dev/snd/controlC23 rw
DeviceAllow=/dev/snd/controlC24 rw
DeviceAllow=/dev/snd/controlC25 rw
DeviceAllow=/dev/snd/controlC26 rw
DeviceAllow=/dev/snd/controlC27 rw
DeviceAllow=/dev/snd/controlC28 rw
DeviceAllow=/dev/snd/controlC29 rw
DeviceAllow=/dev/snd/controlC30 rw
DeviceAllow=/dev/snd/controlC31 rw
SupplementaryGroups=audio
