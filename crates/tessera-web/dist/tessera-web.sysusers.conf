# tessera-web: the portal's user (systemd-sysusers(8)). Member of `tessera`
# so it can read the daemon's status; add it to `tessera-admin` by hand to let
# the portal change settings (ADR 0013).
u tessera-web - "tessera web portal" - /usr/sbin/nologin
m tessera-web tessera
m tessera-web tessera-admin
