[package]
name = "tessera-web"
description = "tessera web portal: HTTP pages and JSON API over the local control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "tessera_web"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "tessera-web"
path = "src/main.rs"
test = false
bench = false

[dependencies]
tessera-control-types = { workspace = true }
tessera-state = { path = "../tessera-state", version = "0.5.2" }
tessera-network = { path = "../tessera-network", version = "0.5.2" }
tesseractl = { path = "../tesseractl", version = "0.5.2" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query", "multipart"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# The EQ engine's websocket (plain `ws://` on the loopback: no TLS feature).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
maud = { version = "0.27", features = ["axum"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
# Routing federation uses one HTTP/1 exchange over a pinned TLS connection.
# No high-level client's retry, redirect, proxy or root-store policy is inherited.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "http1"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
nix = { version = "0.31", default-features = false, features = ["term", "user", "fs", "hostname"] }

[lints]
workspace = true
