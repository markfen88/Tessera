[package]
autotests = false
autoexamples = false
autobenches = false
name = "tesseractl"
description = "tessera local control CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
test = false
doctest = false
name = "tesseractl"
path = "src/lib.rs"

[[bin]]
test = false
name = "tesseractl"
path = "src/main.rs"

[dependencies]
tessera-control-types = { workspace = true }
tessera-state = { path = "../tessera-state", version = "0.2.0-beta" }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde_json = "1"
serde = "1"
