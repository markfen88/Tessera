[package]
name = "tesseractl"
default-run = "tesseractl"
description = "tessera local control CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "tesseractl"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "tesseractl"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "tessera-controller-start"
path = "src/controller_start.rs"
test = false
bench = false

[[bin]]
name = "tessera-controller-command"
path = "src/controller_command.rs"
test = false
bench = false

[dependencies]
tessera-control-types = { workspace = true }
tessera-state = { path = "../tessera-state", version = "0.5.1" }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde_json = "1"
serde = "1"
toml = "1.1"
# Reading the access-lock PIN without echo.
nix = { version = "0.31", default-features = false, features = ["term"] }
