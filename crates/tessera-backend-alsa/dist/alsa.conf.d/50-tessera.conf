# tessera: ALSA PCM plugin for tesserad (a network audio device interoperable
# with Dante(R)).
#
# Install as /etc/alsa/conf.d/50-tessera.conf (or under
# /usr/share/alsa/alsa.conf.d/) together with
#   libasound_module_pcm_tessera.so  in the ALSA plugin directory
#   (Debian: /usr/lib/<multiarch>/alsa-lib/).
#
# The plugin is a thin client of the daemon: it connects to the daemon's
# audio socket, attaches the channels you ask for and copies audio between the
# application and a shared-memory ring. Its clock is the daemon's media clock;
# nothing is resampled. Every option has a default; only `device` is normally
# needed. See crates/tessera-backend-alsa/README.md for the full reference.

pcm.tessera {
    type tessera

    # The logical device of the daemon (its device key). Empty: the default.
    # device "main"

    # Channels of this PCM and the first device channel (numbered from 1).
    channels 2
    first_channel 1

    # Sample rate. 0 (the default) takes the device's rate.
    # rate 48000

    # The daemon's audio socket. Default: $TESSERA_AUDIO_SOCK, else:
    # socket "/run/tessera/audio.sock"

    # Safety margin in frames, added to one period: playback is written this
    # far ahead of the network clock, capture is read this far behind the
    # newest audio the daemon can have delivered. Default 64.
    # latency 64

    # Ring sample format: i32_or_f32 (default), i32, f32, f32_or_i32.
    # ring_format i32_or_f32

    # Who the daemon may be (SO_PEERCRED of the socket): root, the tessera
    # service user or this user by default; 'any' turns the check off.
    # daemon_uid "root,tessera,self"

    # Largest buffer (frames) the PCM accepts; sizes the daemon's ring.
    # Default 16384 (the daemon's default limit). 16-bit formats may use all
    # of it, 32-bit formats half.
    # max_buffer 16384

    # Per-direction overrides: the transmit and receive channel numbering of a
    # device are independent.
    # playback { first_channel 9 }
    # capture  { first_channel 1  channels 8 }
}

# Applications that need another sample format, access type (mmap) or rate
# should open this one: plug converts to what the plugin offers (S16_LE,
# S24_LE, S24_3LE, S32_LE, FLOAT_LE, read/write access, the device's rate).
pcm.tessera_plug {
    type plug
    slave.pcm "tessera"
}

# Make it the default device:
# pcm.!default {
#     type plug
#     slave.pcm "tessera"
# }
