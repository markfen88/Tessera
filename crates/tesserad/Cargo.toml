[package]
name = "tesserad"
description = "tessera audio-over-IP daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "tesserad"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "tesserad"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Off by default: private routing shadow; no admission or native dispatch.
routing-shadow = ["tessera-state/routing-shadow"]
# The in-daemon ALSA hardware-card bridge (`[[bridge]]`, ADR 0007 item 4).
# Off by default: it links libasound (the `alsa` crate runs pkg-config), so
# a plain build and the cross-target checks need no ALSA development files.
# Packaging builds for speakers turn it on (`--features alsa-bridge`).
alsa-bridge = ["dep:tessera-backend-alsa"]
# Test hooks for the bridge suites (a bridge thread that panics on request).
# Only the bridge gate turns it on; never in a product build.
bridge-test-hooks = ["alsa-bridge"]

[dependencies]
tessera-control = { path = "../tessera-control", version = "0.5.1" }
tessera-backend-alsa = { path = "../tessera-backend-alsa", version = "0.5.1", default-features = false, features = ["bridge"], optional = true }
tessera-control-types = { workspace = true }
tessera-state = { path = "../tessera-state", version = "0.5.1" }
tessera-audio-ipc = { path = "../tessera-audio-ipc", version = "0.5.1" }
tessera-clock = { path = "../tessera-clock", version = "0.5.1", features = ["linux"] }
tessera-media = { path = "../tessera-media", version = "0.5.1" }
tessera-discovery = { path = "../tessera-discovery", version = "0.5.1" }
rtrb = "0.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
nix = { version = "0.31", default-features = false, features = ["user", "resource", "fs", "socket", "time", "net", "sched", "mman"] }
