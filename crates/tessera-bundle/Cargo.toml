[package]
name = "tessera-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shell-free Tessera bundle lifecycle and integrity verification"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
minisign-verify = "=0.2.4"
sha2 = "0.10"
rustix = { version = "1", features = ["fs"] }
thiserror = "2"
nix = { version = "0.31", default-features = false, features = ["fs", "ioctl", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[lints]
workspace = true

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "tessera-bundle"
path = "src/main.rs"
test = false
bench = false
