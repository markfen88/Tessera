# Suggested bindings: levels drive gain on the desk's fader law, mutes
# follow the desk's mute state. The portal asks for the device and the
# channels; the `direction` and `channels` given below are examples only.
#
# - Main L/R level and mute drive the host volume and mute (the speaker
#   volume: the sound card control of `[host_volume]`), on the desk's fader
#   law: `host_volume` / `host_mute`. Without `[host_volume]`, map them to
#   the output stage of RX 1-2 instead (`output_gain` / `output_mute`).
# - Ip4 and Ip5 drive the input gain of incoming network sources (RX 1-2
#   and RX 3-4, before the mix). The other inputs suggest no channels.

[[binding]]
control = "ip1"
action = "gain"
curve = "fader"

[[binding]]
control = "ip1-mute"
action = "mute"

[[binding]]
control = "ip2"
action = "gain"
curve = "fader"

[[binding]]
control = "ip2-mute"
action = "mute"

[[binding]]
control = "ip3"
action = "gain"
curve = "fader"

[[binding]]
control = "ip3-mute"
action = "mute"

[[binding]]
control = "ip4"
action = "gain"
curve = "fader"
direction = "rx"
channels = [1, 2]

[[binding]]
control = "ip4-mute"
action = "mute"

[[binding]]
control = "ip5"
action = "gain"
curve = "fader"
direction = "rx"
channels = [3, 4]

[[binding]]
