# Allen & Heath CQ series (CQ-12T, CQ-18T, CQ-20B) driven over USB MIDI.
#
# A tessera surface profile: the controls a device has and how it sends
# them, so that a surface for it needs no learning. Copy this file to
# /etc/tessera/surfaces.d/ (or share it) as a starting point for another
# device.
#
# Source: Allen & Heath "CQ MIDI Protocol" V1.2 (issue 5) and a community
# control module for the CQ. Confidence: likely (not yet checked against a
# capture of this desk).
#
# Everything is NRPN on MIDI channel 1: CC 99 = parameter MSB, CC 98 = LSB,
# CC 6 = value MSB (VC), CC 38 = value LSB (VF), value = VC << 7 | VF.
# Levels are 0..16320 on the desk's fader law ("fader" below); mutes are
# 1 (on) / 0 (off). The desk sends every change unsolicited and accepts the
# same messages, so its faders follow what tessera sends back: they are
# `motorized` here (a surface that shows the value tessera sets owns no
# gain). NRPN number = MSB * 128 + LSB.

name = "allen-heath-cq"
vendor = "Allen & Heath"
model = "CQ series"
description = "Input levels to Main LR, Main LR and Out 1-6 levels, and their mutes, over USB MIDI."

[match]
midi_card = "CQ"

# Desk raw level -> milli-dB. Raw 0 is off.
[curves]
fader = [
    { raw = 192, mdb = -89000 },
    { raw = 320, mdb = -80000 },
    { raw = 768, mdb = -60000 },
    { raw = 1024, mdb = -50000 },
    { raw = 1984, mdb = -40000 },
    { raw = 3968, mdb = -30000 },
    { raw = 5952, mdb = -20000 },
    { raw = 7936, mdb = -10000 },
    { raw = 10048, mdb = -5000 },
    { raw = 12544, mdb = 0 },
    { raw = 14784, mdb = 5000 },
    { raw = 16320, mdb = 10000 },
]

[[control]]
id = "ip1"
label = "Ch 1"
kind = "fader"
max = 16320
motorized = true
midi = { kind = "nrpn", channel = 1, number = 0x2000 }  # 40/00

[[control]]
id = "ip1-mute"
label = "Ch 1 mute"
kind = "button"
midi = { kind = "nrpn", channel = 1, number = 0x0000 }  # 00/00

