[package]
autotests = false
autoexamples = false
autobenches = false
name = "tessera-control-types"
description = "Public command and event types (the future API contract; semver-stable)"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std", "serde"]
std = ["serde?/std"]
serde = ["dep:serde"]

[lib]
test = false
bench = false
doctest = false

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

