# cargo-deny policy. Our crates are MPL-2.0; dependencies must be compatible
# with distributing tessera under MPL-2.0 (including inside devices).

[graph]
all-features = true

[licenses]
allow = [
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
# GPL/AGPL/LGPL dependencies are not allowed (clean-room + licence freedom).
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # zbus_names: transitive via zbus for Avahi; remove the ignore once zbus is upgraded
    "RUSTSEC-2026-0371",
    # zvariant: transitive via zbus for Avahi; remove the ignore once zbus is upgraded
    "RUSTSEC-2026-0370",
    # zvariant_derive: transitive via zbus for Avahi; remove the ignore once zbus is upgraded
    "RUSTSEC-2026-0372",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
