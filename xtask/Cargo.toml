[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Rust build, packaging and validation tasks for Tessera"
autotests = false
autoexamples = false
autobenches = false

[features]
# Development, test, lab and internal publishing tasks. Published source
# releases leave their modules out and build xtask without this feature.
default = []
internal = ["dep:nix", "dep:serde", "dep:tessera-control", "dep:tessera-control-types", "dep:toml"]

[dependencies]
minisign = "=0.7.9"
sha2 = "0.10"
tessera-bundle = { path = "../crates/tessera-bundle" }
tessera-control-types = { path = "../crates/tessera-control-types", optional = true }
tessera-control = { path = "../crates/tessera-control", optional = true }
nix = { version = "0.31", default-features = false, features = ["fs", "time", "socket", "net"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
toml = { version = "1.1", optional = true }

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false
bench = false
