# tessera: service user and groups (systemd-sysusers(8)).
#
# `tessera`        the daemon's user and group; also the group that owns
#                  /run/tessera/*.sock, so members may read status and
#                  attach audio clients.
# `tessera-admin`  members may change settings (tesseractl set-*, config
#                  reload). Root may always. The name is configurable with
#                  `[daemon] admin_group` in /etc/tessera/config.toml.
u tessera - "tessera audio-over-IP daemon" /var/lib/tessera /usr/sbin/nologin
# Deployment note: the control socket is mode 0660, group `tessera`, and that
# is checked by the kernel before the daemon sees the caller. An administrator
# therefore must be a member of BOTH `tessera` and `tessera-admin` (root
# excepted).
g tessera-admin -
