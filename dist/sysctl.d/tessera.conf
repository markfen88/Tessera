# tessera: socket buffer ceilings for the media sockets (sysctl.d(5)).
#
# tesserad asks for 2 MiB receive and send buffers per media socket and does
# not hold CAP_NET_ADMIN (so it cannot use SO_RCVBUFFORCE / SO_SNDBUFFORCE):
# the kernel caps the request at these ceilings. The default of about 208 KiB
# is enough for a few dozen channels; the daemon logs the effective sizes,
# warns when they are capped and reports them in `tesseractl metrics`
# (engine.socket_buffer_min_bytes, engine.socket_buffers_capped).
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
