# tessera: directories (systemd-tmpfiles(8)).
d /etc/tessera          0755 root    root    -
d /etc/tessera/config.d 0755 root    root    -
d /var/lib/tessera      0750 tessera tessera -
d /run/tessera          0755 tessera tessera -
# The existing Controller runtime's one managed flow drop-in; never truncate.
f /etc/tessera/config.d/90-probe-flows.toml 0644 tessera tessera -
