# Shared /etc/tessera is owned only by tessera.conf.
# Keep the helper journal private; never let service startup chown its tree.
d /var/lib/tessera-network 0700 root root -
d /run/tessera-network 0750 root tessera-web -
# The rate follower's ALSA snippet ([appliance.rate_follow] rate_file): written by the portal,
# read by every ALSA client that opens the speaker's shared bus. Seeded once, never overwritten.
d /var/lib/tessera-rate 0755 tessera-web tessera-web -
f /var/lib/tessera-rate/alsa.conf 0644 tessera-web tessera-web - tessera.rate 48000
